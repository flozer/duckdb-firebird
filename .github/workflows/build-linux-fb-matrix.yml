name: Build + Test Linux x64 (FB 3/4/5 matrix)

# Builds the extension once and runs the SQL test suites against three
# Firebird major versions (3, 4, 5) sequentially on a single Ubuntu 24.04
# runner. The FB server is started in a Docker container, port-mapped to
# localhost:3050. The client library used to talk to it is extracted from
# that SAME container image (see "Extract matching libfbclient" below) —
# earlier versions of this workflow used the runner's system-wide
# libfbclient.so.2 (installed once via apt, always Firebird 3.0 on Ubuntu
# noble) for all three matrix legs, which meant fb4/fb5 ran an FB3 client
# against an FB4/FB5 server: a real client/server wire-protocol mismatch,
# not a version the client and server ever agree to negotiate down to.
# That surfaced as "sqlcode -204 Data type unknown" preparing a query
# against a self-join/aggregate view (see issue #40) — nothing to do with
# extension code, purely this workflow using one fixed client library for
# every server version.
#
# The three legs build DuckDB v1.5.6. A fourth leg builds DuckDB v2.0.1
# against Firebird 5, so the FIREBIRD_DUCKDB_V2 path also runs the FB4+-only
# tests and scripts (build-linux.yml runs both DuckDB lines, but against a
# Firebird 3 server only). One deliberate exception to the matching client:
# the DuckDB v1.5.6 Firebird 5 leg also runs firebird_health.test through a
# Firebird 4 client (#108).

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - ".github/badges/**"
  pull_request:
    paths-ignore:
      - "README.md"
      - "docs/**"
      - ".github/badges/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: linux-x64 / fb${{ matrix.fb_major }}${{ matrix.name_suffix }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - fb_major: 3
            fb_image: firebirdsql/firebird:3-noble
            duckdb: v1.5.6
          - fb_major: 4
            fb_image: firebirdsql/firebird:4-noble
            duckdb: v1.5.6
          - fb_major: 5
            fb_image: firebirdsql/firebird:5-noble
            duckdb: v1.5.6
          - fb_major: 5
            fb_image: firebirdsql/firebird:5-noble
            duckdb: v2.0.1
            name_suffix: " (DuckDB v2.0.1)"
          # The write path runs on DuckDB 2.0 with every Firebird version.
          - fb_major: 3
            fb_image: firebirdsql/firebird:3-noble
            duckdb: v2.0.1
            name_suffix: " (DuckDB v2.0.1)"
          - fb_major: 4
            fb_image: firebirdsql/firebird:4-noble
            duckdb: v2.0.1
            name_suffix: " (DuckDB v2.0.1)"
    env:
      DUCKDB_VERSION: ${{ matrix.duckdb }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Guard against inline fixture DDL drift (#39)
        run: bash scripts/check_no_inline_fixture_drift.sh

      - name: Install build deps + firebird client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config python3 ccache \
            firebird-dev

      - name: Configure ccache
        run: |
          # ccache 4.x uses ~/.cache/ccache unless ~/.ccache already exists,
          # so pin it to the directory the cache step saves and restores.
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          CCACHE_DIR=$HOME/.ccache ccache --max-size=1G
          echo "PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-linux-fb${{ matrix.fb_major }}-${{ env.DUCKDB_VERSION }}-${{ github.sha }}
          restore-keys: ccache-linux-fb${{ matrix.fb_major }}-${{ env.DUCKDB_VERSION }}-

      - name: Start Firebird ${{ matrix.fb_major }} container
        run: |
          docker run -d \
              --name fb \
              -p 3050:3050 \
              -e FIREBIRD_ROOT_PASSWORD=masterkey \
              -e FIREBIRD_USE_LEGACY_AUTH=true \
              ${{ matrix.fb_image }}
          # Wait for the server to accept connections.
          for i in $(seq 1 30); do
            if nc -z localhost 3050; then echo "FB up"; break; fi
            sleep 1
          done
          docker logs fb | tail -20

      - name: Provision FB${{ matrix.fb_major }} fixtures
        run: |
          # Apply the EMPLOYEE fixture via isql inside the container —
          # the container has the matching server-side libfbclient and
          # the database file path is server-local.
          docker exec -i fb bash -c "isql -u SYSDBA -p masterkey" <<'SQL'
          CREATE DATABASE '/var/lib/firebird/data/test.fdb' DEFAULT CHARACTER SET UTF8;
          SQL
          docker cp scripts/fixture_common.sql fb:/tmp/fixture_common.sql
          docker exec fb isql -u SYSDBA -p masterkey -i /tmp/fixture_common.sql /var/lib/firebird/data/test.fdb

          if [ "${{ matrix.fb_major }}" != "3" ]; then
            docker cp scripts/fixture_biz4.sql fb:/tmp/fixture_biz4.sql
            printf "%s\n" "CREATE DATABASE '/var/lib/firebird/data/biz4.fdb' DEFAULT CHARACTER SET UTF8;" \
              | docker exec -i fb bash -c "isql -u SYSDBA -p masterkey"
            docker exec fb isql -u SYSDBA -p masterkey -i /tmp/fixture_biz4.sql /var/lib/firebird/data/biz4.fdb

            # DECFLOAT fixture (issue #48) -- loads into the SAME biz4.fdb,
            # no new database, no table-name conflict with fixture_biz4.sql
            # (DECVALS vs FB4_TYPES/DEPARTMENT/CUSTOMER).
            docker cp scripts/fixture_decfloat.sql fb:/tmp/fixture_decfloat.sql
            docker exec fb isql -u SYSDBA -p masterkey -i /tmp/fixture_decfloat.sql /var/lib/firebird/data/biz4.fdb
          fi

          # CHARACTER SET NONE fixture (issue #26) -- exercises the
          # none_encoding feature. Unlike fixture_biz4.sql above, this runs
          # on every matrix leg (CHARACTER SET NONE is not FB4+-only).
          docker cp scripts/fixture_none_charset.sql fb:/tmp/fixture_none_charset.sql
          printf "%s\n" "CREATE DATABASE '/var/lib/firebird/data/none.fdb' DEFAULT CHARACTER SET NONE;" \
            | docker exec -i fb bash -c "isql -u SYSDBA -p masterkey"
          docker exec fb isql -u SYSDBA -p masterkey -i /tmp/fixture_none_charset.sql /var/lib/firebird/data/none.fdb

          # Partitions fixture (roadmap F4) -- version-neutral (plain
          # INTEGER PK with a sparse, wide range) in its own database, so
          # the pinned relation lists of the main fixture stay stable.
          docker cp scripts/fixture_partitions.sql fb:/tmp/fixture_partitions.sql
          printf "%s\n" "CREATE DATABASE '/var/lib/firebird/data/partitions.fdb' DEFAULT CHARACTER SET UTF8;" \
            | docker exec -i fb bash -c "isql -u SYSDBA -p masterkey"
          docker exec fb isql -u SYSDBA -p masterkey -i /tmp/fixture_partitions.sql /var/lib/firebird/data/partitions.fdb

          # Numerics fixture (roadmap G3) -- version-neutral (NUMERIC(18,s)
          # exists on all Firebird versions), own database: int64 sentinels
          # for the numeric_widen_int64 coverage.
          docker cp scripts/fixture_numerics.sql fb:/tmp/fixture_numerics.sql
          printf "%s\n" "CREATE DATABASE '/var/lib/firebird/data/numerics.fdb' DEFAULT CHARACTER SET UTF8;" \
            | docker exec -i fb bash -c "isql -u SYSDBA -p masterkey"
          docker exec fb isql -u SYSDBA -p masterkey -i /tmp/fixture_numerics.sql /var/lib/firebird/data/numerics.fdb

          # firebird_query fixture: its own database. The FB4+ types load
          # into the same database on FB4/FB5.
          docker cp scripts/fixture_query.sql fb:/tmp/fixture_query.sql
          printf "%s\n" "CREATE DATABASE '/var/lib/firebird/data/query.fdb' DEFAULT CHARACTER SET UTF8;" \
            | docker exec -i fb bash -c "isql -u SYSDBA -p masterkey"
          docker exec fb isql -u SYSDBA -p masterkey -i /tmp/fixture_query.sql /var/lib/firebird/data/query.fdb
          if [ "${{ matrix.fb_major }}" != "3" ]; then
            docker cp scripts/fixture_query4.sql fb:/tmp/fixture_query4.sql
            docker exec fb isql -u SYSDBA -p masterkey -i /tmp/fixture_query4.sql /var/lib/firebird/data/query.fdb
          fi

          # Write-path fixture: its own database, so the writes never touch
          # the other fixtures. The FB4+ types load into the same database
          # on FB4/FB5.
          docker cp scripts/fixture_rw.sql fb:/tmp/fixture_rw.sql
          printf "%s\n" "CREATE DATABASE '/var/lib/firebird/data/rw.fdb' DEFAULT CHARACTER SET UTF8;" \
            | docker exec -i fb bash -c "isql -u SYSDBA -p masterkey"
          docker exec fb isql -u SYSDBA -p masterkey -i /tmp/fixture_rw.sql /var/lib/firebird/data/rw.fdb
          if [ "${{ matrix.fb_major }}" != "3" ]; then
            docker cp scripts/fixture_rw4.sql fb:/tmp/fixture_rw4.sql
            docker exec fb isql -u SYSDBA -p masterkey -i /tmp/fixture_rw4.sql /var/lib/firebird/data/rw.fdb
          fi

          # DataTypeCompatibility fixture (FB4+): its own database, opened
          # through a databases.conf alias with DataTypeCompatibility = 2.5,
          # so the server describes INT128 / DECFLOAT / WITH TIME ZONE /
          # BOOLEAN in their legacy form unless the client asks for the
          # native types (isc_dpb_set_bind). databases.conf is re-read on
          # attach, so the running server picks the alias up.
          if [ "${{ matrix.fb_major }}" != "3" ]; then
            docker exec fb bash -c "printf '%s\n' '' 'compat25 = /var/lib/firebird/data/compat25.fdb' '{' '    DataTypeCompatibility = 2.5' '}' >> /opt/firebird/databases.conf"
            docker cp scripts/fixture_type_compat.sql fb:/tmp/fixture_type_compat.sql
            printf "%s\n" "CREATE DATABASE 'localhost:compat25' DEFAULT CHARACTER SET UTF8;" \
              | docker exec -i fb bash -c "isql -u SYSDBA -p masterkey"
            docker exec fb isql -u SYSDBA -p masterkey -i /tmp/fixture_type_compat.sql localhost:compat25
            # The alias must really be in legacy mode (BOOLEAN described as
            # CHAR(5) = sqltype 452 TEXT), or firebird_type_compat.test would
            # pass without the extension's fix.
            printf "%s\n" "SET SQLDA_DISPLAY ON;" "SELECT FLAG FROM TYPE_COMPAT WHERE ID = 1;" \
              | docker exec -i fb isql -u SYSDBA -p masterkey localhost:compat25 | tee /tmp/compat25-sqlda.txt
            grep -q "sqltype: 452 TEXT" /tmp/compat25-sqlda.txt \
              || { echo "compat25 is not in DataTypeCompatibility = 2.5 mode"; exit 1; }
            # An empty database whose attachments the server kills after one
            # idle minute, for check_dead_pooled_connection.sh's idle phase.
            docker exec fb bash -c "printf '%s\n' '' 'idle1 = /var/lib/firebird/data/idle1.fdb' '{' '    ConnectionIdleTimeout = 1' '}' >> /opt/firebird/databases.conf"
            printf "%s\n" "CREATE DATABASE 'localhost:idle1' DEFAULT CHARACTER SET UTF8;" \
              | docker exec -i fb bash -c "isql -u SYSDBA -p masterkey"
          fi

          # Suite tests connect over TCP — expose the URL form.
          echo "FIREBIRD_TEST_DB=firebird://SYSDBA:masterkey@localhost:3050/var/lib/firebird/data/test.fdb?charset=UTF8" >> $GITHUB_ENV
          # charset=NONE (not UTF8/WIN1252/etc) -- ValidateClientCharset
          # (src/firebird_client.cpp) only accepts UTF8/NONE/OCTETS, and
          # only NONE preserves the raw, untransliterated bytes
          # none_encoding decodes client-side. This mirrors the local
          # setup, where FIREBIRD_NONE_DB is a bare path with no charset
          # param at all -- that leaves info.charset empty, so the
          # extension never sends isc_dpb_lc_ctype and Firebird defaults
          # the connection to NONE. ?charset=NONE here makes that same
          # behavior explicit.
          echo "FIREBIRD_NONE_DB=firebird://SYSDBA:masterkey@localhost:3050/var/lib/firebird/data/none.fdb?charset=NONE" >> $GITHUB_ENV
          echo "FIREBIRD_PARTITIONS_DB=firebird://SYSDBA:masterkey@localhost:3050/var/lib/firebird/data/partitions.fdb?charset=UTF8" >> $GITHUB_ENV
          echo "FIREBIRD_NUMERICS_DB=firebird://SYSDBA:masterkey@localhost:3050/var/lib/firebird/data/numerics.fdb?charset=UTF8" >> $GITHUB_ENV
          echo "FIREBIRD_QUERY_DB=firebird://SYSDBA:masterkey@localhost:3050/var/lib/firebird/data/query.fdb?charset=UTF8" >> $GITHUB_ENV
          echo "FIREBIRD_RW_DB=firebird://SYSDBA:masterkey@localhost:3050/var/lib/firebird/data/rw.fdb?charset=UTF8" >> $GITHUB_ENV
          # DECVALS still loads into biz4.fdb above (issue #48). Exporting
          # the env HERE (instead of only in the FB4+ smoke step) lets the
          # main suite step run firebird_decfloat.test on FB4/FB5 legs;
          # on FB3 the var stays unset and the test self-skips via its
          # require-env gate.
          if [ "${{ matrix.fb_major }}" != "3" ]; then
            echo "FIREBIRD_DECFLOAT_DB=firebird://SYSDBA:masterkey@localhost:3050/var/lib/firebird/data/biz4.fdb?charset=UTF8" >> $GITHUB_ENV
            # An alias needs the key=value form (the URL form keeps a leading '/').
            echo "FIREBIRD_TYPE_COMPAT_DB=user=SYSDBA;password=masterkey;database=localhost/3050:compat25;charset=UTF8" >> $GITHUB_ENV
            echo "FIREBIRD_QUERY4_DB=firebird://SYSDBA:masterkey@localhost:3050/var/lib/firebird/data/query.fdb?charset=UTF8" >> $GITHUB_ENV
            echo "FIREBIRD_RW4_DB=firebird://SYSDBA:masterkey@localhost:3050/var/lib/firebird/data/rw.fdb?charset=UTF8" >> $GITHUB_ENV
          fi

      - name: Extract matching libfbclient from the fb${{ matrix.fb_major }} container
        run: |
          # The extension loads libfbclient.so.2 at runtime via dlopen
          # (src/firebird_client_loader.cpp) rather than linking it at
          # build time, so whatever copy is on the runner's library search
          # path is what actually talks wire protocol to the server. Pull
          # the client lib straight out of THIS job's own container image
          # so it's always version-matched to the server it's about to
          # talk to, instead of relying on the runner's single system-wide
          # apt-installed copy (always FB3.0 on Ubuntu noble).
          # SONAME convention differs by major version -- FB 2.5/3.0 use
          # libfbclient.so.2, FB4+ bumped it to match the major version
          # (libfbclient.so.4, .so.5) after an ABI break, so the pattern
          # has to stay broad ("libfbclient.so*") rather than hardcoding
          # ".2". A first attempt at this fix found the right file this
          # way but still failed to dlopen() on fb3/fb4 -- both of those
          # images keep libfbclient in a self-contained directory
          # (/opt/firebird/lib, /usr/lib64) alongside its own private
          # copies of transitive dependencies (crypto/ICU/etc). Copying
          # only the one .so file stranded those siblings inside the
          # container, so the runner's dynamic linker couldn't resolve
          # them. fb5 happened to live under the Ubuntu multiarch path
          # (/usr/lib/x86_64-linux-gnu) where its deps were already
          # satisfied by packages apt had already installed on the
          # runner, which is why only fb3/fb4 hit this.
          LIB_IN_CONTAINER=$(docker exec fb sh -c "find / -xdev -name 'libfbclient.so*' 2>/dev/null | head -1")
          if [ -z "$LIB_IN_CONTAINER" ]; then
            echo "::error::could not locate libfbclient.so* inside the fb${{ matrix.fb_major }} container"
            exit 1
          fi
          echo "found $LIB_IN_CONTAINER in container"
          # Copy the lib itself plus whatever *specific* shared-library
          # dependencies ldd resolves for it inside the container -- not
          # the whole containing directory, which for fb5 is the shared
          # Ubuntu multiarch path (/usr/lib/x86_64-linux-gnu) holding
          # thousands of unrelated system libraries. ldd's "=> /path"
          # lines give exactly the resolved deps that matter; anything
          # ldd resolves via the runner's own ld.so cache (libc, libm,
          # etc., already present) is harmless to copy too, just extra
          # bytes, not extra risk.
          LOCAL_DIR="$PWD/fbclient-fb${{ matrix.fb_major }}"
          mkdir -p "$LOCAL_DIR"
          # Exclude core glibc-family libs (libc/libpthread/libm/libdl/
          # librt/ld-linux) from the copy: those must always come from the
          # runner's own base system. Preferring a container-side copy of
          # THOSE via LD_LIBRARY_PATH risks a glibc ABI mismatch across the
          # whole process, not just Firebird calls -- strictly worse than
          # the bug this step exists to fix. Everything else Firebird-
          # specific (ICU, crypto/decNumber, etc.) is safe and necessary
          # to copy alongside it.
          docker exec fb sh -c "ldd '$LIB_IN_CONTAINER'" \
            | grep -oE '/[^ ]+' | sort -u \
            | grep -vE '/(libc|libpthread|libm|libdl|librt|ld-linux)[.-]' \
            | while read -r dep; do
                docker cp -L "fb:$dep" "$LOCAL_DIR/$(basename "$dep")" 2>/dev/null || true
              done
          docker cp -L "fb:$LIB_IN_CONTAINER" "$LOCAL_DIR/$(basename "$LIB_IN_CONTAINER")"
          LOCAL_LIB="$LOCAL_DIR/$(basename "$LIB_IN_CONTAINER")"
          file "$LOCAL_LIB"
          echo "LD_LIBRARY_PATH=$LOCAL_DIR:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "DUCKDB_FIREBIRD_CLIENT_LIBRARY=$LOCAL_LIB" >> $GITHUB_ENV

      - name: Build and run mkblob_fixture (issue #35 / #39)
        run: |
          # mkblob_fixture.cpp writes TBLOB_MULTISEG's genuinely
          # multi-segment BLOB content via real isc_put_segment calls --
          # a plain SQL literal can't do this (see the file's own header
          # comment), so it can't be folded into fixture_common.sql. The
          # firebirdsql/firebird:*-noble images have no C++ toolchain, so
          # this compiles on the runner instead, linking against the
          # SAME version-matched libfbclient the previous step already
          # extracted from this job's own container -- never the
          # apt-installed firebird-dev package's generic -lfbclient,
          # which would silently relink against a mismatched client
          # version and reintroduce the exact bug PR #41 fixed.
          LOCAL_LIB="$DUCKDB_FIREBIRD_CLIENT_LIBRARY"
          LOCAL_DIR="$(dirname "$LOCAL_LIB")"
          g++ -std=c++17 -I/usr/include/firebird \
              -o mkblob_fixture scripts/mkblob_fixture.cpp \
              -L"$LOCAL_DIR" -l:"$(basename "$LOCAL_LIB")"
          ./mkblob_fixture localhost/3050:/var/lib/firebird/data/test.fdb SYSDBA masterkey 1

      - name: Pin extension-ci-tools to the v2.0 branch
        if: matrix.duckdb == 'v2.0.1'
        run: |
          # Same recipe as build-linux.yml's v2.0 leg.
          git -C extension-ci-tools fetch origin v2.0-cyanoptera
          git -C extension-ci-tools checkout FETCH_HEAD

      - name: Pin DuckDB version
        run: |
          DUCKDB_GIT_VERSION=${DUCKDB_VERSION} make set_duckdb_version

      - name: Build (release)
        env:
          GEN: ninja
        run: |
          ccache --zero-stats
          make release
          ccache --show-stats

      - name: CLI with the extension loaded (DuckDB v2.0)
        if: matrix.duckdb == 'v2.0.1'
        run: |
          # On v2.0 the build links the extension into neither binary
          # ("Extensions built but not linked: [firebird]"): unittest loads
          # the built extension on `require firebird`, but the CLI needs an
          # explicit LOAD. So the scripts and the smoke step below LOAD it
          # (DUCKDB_PRELUDE, which every script reads) through a wrapper
          # that allows unsigned extensions. -no-agent keeps the v2.0 CLI
          # from switching to its agent output format when stdout is not a
          # terminal and an agent variable (AI_AGENT, CLAUDECODE, ...) is set.
          load="LOAD '$GITHUB_WORKSPACE/build/release/extension/firebird/firebird.duckdb_extension';"
          cli="$GITHUB_WORKSPACE/duckdb-cli.sh"
          printf '%s\n' '#!/usr/bin/env bash' \
            "exec $GITHUB_WORKSPACE/build/release/duckdb -no-agent -unsigned \"\$@\"" > "$cli"
          chmod +x "$cli"
          echo "DUCKDB=$cli" >> $GITHUB_ENV
          echo "DUCKDB_PRELUDE=$load" >> $GITHUB_ENV
          # Tests that hold for DuckDB 2.0 only (require-env FIREBIRD_DUCKDB_V2).
          echo "FIREBIRD_DUCKDB_V2=1" >> $GITHUB_ENV
          cat "$cli"
          # The loaded extension must provide firebird_scan.
          n=$(printf '%s\n' "$load" \
                "SELECT count(*) FROM duckdb_functions() WHERE function_name = 'firebird_scan';" \
              | "$cli" -list -noheader | tr -d '\r' | tail -n 1)
          echo "firebird_scan functions after LOAD: $n"
          [ "$n" -ge 1 ]

      - name: Run SQL test suite
        env:
          ISC_USER: SYSDBA
          ISC_PASSWORD: masterkey
        run: |
          ./build/release/test/unittest test/sql/firebird_scan.test
          ./build/release/test/unittest test/sql/firebird_attach.test
          ./build/release/test/unittest test/sql/firebird_health.test
          ./build/release/test/unittest test/sql/firebird_index_profile.test
          ./build/release/test/unittest test/sql/firebird_bind_params.test
          ./build/release/test/unittest test/sql/firebird_blob_lossless.test
          ./build/release/test/unittest test/sql/firebird_dbt_sources.test
          ./build/release/test/unittest test/sql/firebird_metadata.test
          ./build/release/test/unittest test/sql/firebird_metadata_bridge.test
          ./build/release/test/unittest test/sql/firebird_observability.test
          ./build/release/test/unittest test/sql/firebird_paging.test
          ./build/release/test/unittest test/sql/firebird_pool.test
          ./build/release/test/unittest test/sql/firebird_pool_stats.test
          ./build/release/test/unittest test/sql/firebird_predicates.test
          ./build/release/test/unittest test/sql/firebird_profile_table.test
          # firebird_explain_pushdown.test and firebird_type_audit.test
          # gate their entire file on `require-env FIREBIRD_NONE_DB` --
          # now provisioned above (issue #26), so both run for real here.
          ./build/release/test/unittest test/sql/firebird_none_charset.test
          ./build/release/test/unittest test/sql/firebird_explain_pushdown.test
          ./build/release/test/unittest test/sql/firebird_type_audit.test
          # Catalog-metadata-only test (issue #63); needs no fixture
          ./build/release/test/unittest test/sql/firebird_function_docs.test
          # F4: real recommended_partitions > 1 coverage on a dedicated
          # sparse-wide-PK fixture (all FB versions).
          ./build/release/test/unittest test/sql/firebird_partitions_scan.test
          # Shared snapshot for partitioned scans: snapshot_mode reported
          # per FB version (shared on FB4+, independent on FB3), same
          # partitions fixture.
          ./build/release/test/unittest test/sql/firebird_shared_snapshot.test
          # partition_by = 'pk' | 'dbkey' (DB_KEY ranges on FB4/FB5, fallback on FB3).
          ./build/release/test/unittest test/sql/firebird_partition_by.test
          # Transaction snapshot on the ATTACH path (opt-in): 'transaction'
          # on FB4+, per-scan behavior on FB3; same partitions fixture.
          ./build/release/test/unittest test/sql/firebird_transaction_snapshot.test
          # G-queue coverage (v1.2.0): unpushed-mode guard + none_pushdown
          # (NONE fixture), numeric_widen (numerics fixture), session
          # stability + bytes estimate (main fixture).
          ./build/release/test/unittest test/sql/firebird_unpushed_mode.test
          ./build/release/test/unittest test/sql/firebird_none_pushdown.test
          ./build/release/test/unittest test/sql/firebird_numeric_widen.test
          ./build/release/test/unittest test/sql/firebird_session_stability.test
          ./build/release/test/unittest test/sql/firebird_bytes_estimate.test
          # DECFLOAT promoted into the main suite (roadmap F3): runs
          # wherever FIREBIRD_DECFLOAT_DB is exported (FB4/FB5 legs);
          # self-skips on FB3 via its require-env gate.
          ./build/release/test/unittest test/sql/firebird_decfloat.test
          # DataTypeCompatibility guard: FB4/FB5 legs (FIREBIRD_TYPE_COMPAT_DB
          # exported above); self-skips on FB3.
          ./build/release/test/unittest test/sql/firebird_type_compat.test
          # Connection errors never echo the password (needs only the client library).
          ./build/release/test/unittest test/sql/firebird_secrets.test
          # firebird_query (FB4+ types through FIREBIRD_QUERY4_DB, FB4/FB5).
          ./build/release/test/unittest test/sql/firebird_query.test
          ./build/release/test/unittest test/sql/firebird_query_fb4.test
          # Writes (READ_WRITE ATTACH; FB4+ types through FIREBIRD_RW4_DB).
          ./build/release/test/unittest test/sql/firebird_execute.test
          ./build/release/test/unittest test/sql/firebird_execute_atomic.test
          ./build/release/test/unittest test/sql/firebird_execute_autocommit_v2.test
          ./build/release/test/unittest test/sql/firebird_read_your_writes.test
          ./build/release/test/unittest test/sql/firebird_least_privilege.test
          ./build/release/test/unittest test/sql/firebird_ddl_cache.test
          ./build/release/test/unittest test/sql/firebird_session_reset.test
          ./build/release/test/unittest test/sql/firebird_execute_source.test
          ./build/release/test/unittest test/sql/firebird_execute_source_fb4.test
          ./build/release/test/unittest test/sql/firebird_insert.test
          ./build/release/test/unittest test/sql/firebird_insert_fb4.test

      - name: Writes commit when a client reads one row and closes (Python)
        # sqllogictest reads every result fully; this needs a real client
        # that stops after fetchone(). Uses the Python package of the leg's
        # DuckDB version (1.5.6 or 2.0.1).
        run: |
          python3 -m venv /tmp/pyduck
          /tmp/pyduck/bin/pip install --quiet "duckdb==${DUCKDB_VERSION#v}"
          /tmp/pyduck/bin/python scripts/check_execute_fetchone.py \
            "$GITHUB_WORKSPACE/build/release/extension/firebird/firebird.duckdb_extension" \
            "$FIREBIRD_RW_DB"

      - name: An interrupt cancels the running Firebird request (Python)
        # sqllogictest can't interrupt a running statement; this needs a
        # client that calls interrupt() while a query waits on Firebird.
        # Uses the Python package of the leg's DuckDB version.
        run: |
          python3 -m venv /tmp/pycancel
          /tmp/pycancel/bin/pip install --quiet "duckdb==${DUCKDB_VERSION#v}"
          timeout 180 /tmp/pycancel/bin/python scripts/check_cancel.py \
            "$GITHUB_WORKSPACE/build/release/extension/firebird/firebird.duckdb_extension" \
            "$FIREBIRD_QUERY_DB"

      - name: Firebird 4 client against the Firebird 5 server (inline_blobs_unavailable)
        # One Firebird 5 leg is enough: the inline-blob decision in
        # firebird_health.cpp and the client loader have no DuckDB-version
        # branch.
        if: matrix.fb_major == '5' && matrix.duckdb == 'v1.5.6'
        env:
          ISC_USER: SYSDBA
          ISC_PASSWORD: masterkey
        run: |
          # Every other step pairs a client with a server of its own
          # version, so firebird_health()'s inline_blobs_unavailable
          # warning (a 5.0.3+ server reached over TCP through a client that
          # can't inline blobs) never fires there (#108). Take the FB4
          # libfbclient (and its own dependencies, as the extraction step
          # above does) from the FB4 image and run firebird_health.test
          # through it against this leg's FB5 server: the test derives its
          # expectations from client_version, so it now expects NULL and
          # the warning.
          docker run -d --name fb4client --entrypoint sleep firebirdsql/firebird:4-noble infinity
          trap 'docker rm -f fb4client >/dev/null 2>&1 || true' EXIT
          LIB_IN_CONTAINER=$(docker exec fb4client sh -c "find / -xdev -name 'libfbclient.so*' 2>/dev/null | head -1")
          if [ -z "$LIB_IN_CONTAINER" ]; then
            echo "::error::could not locate libfbclient.so* in firebirdsql/firebird:4-noble"
            exit 1
          fi
          echo "found $LIB_IN_CONTAINER in the FB4 image"
          FB4_DIR="$PWD/fbclient-fb4-on-fb5"
          mkdir -p "$FB4_DIR"
          docker exec fb4client sh -c "ldd '$LIB_IN_CONTAINER'" \
            | grep -oE '/[^ ]+' | sort -u \
            | grep -vE '/(libc|libpthread|libm|libdl|librt|ld-linux)[.-]' \
            | while read -r dep; do
                docker cp -L "fb4client:$dep" "$FB4_DIR/$(basename "$dep")" 2>/dev/null || true
              done
          docker cp -L "fb4client:$LIB_IN_CONTAINER" "$FB4_DIR/$(basename "$LIB_IN_CONTAINER")"
          ls -l "$FB4_DIR"
          export DUCKDB_FIREBIRD_CLIENT_LIBRARY="$FB4_DIR/$(basename "$LIB_IN_CONTAINER")"
          export LD_LIBRARY_PATH="$FB4_DIR"
          # The pairing this step exists for: a 4.x client, a 5.0.3+ server,
          # TCP. Checked directly, so a client that silently stayed 5.x
          # can't make the test below pass vacuously.
          out=$(./build/release/duckdb -csv -noheader -c "
            ATTACH '${FIREBIRD_TEST_DB}' AS fb (TYPE firebird);
            SELECT client_version, engine_version, network_protocol,
                   inline_blob_size IS NULL,
                   list_contains(warnings, 'inline_blobs_unavailable')
            FROM firebird_health('fb');")
          echo "$out"
          echo "$out" | grep -qE '^4\.[0-9.]+,5\.[0-9.]+,TCPv[46],true,true$' || {
            echo "::error::expected a 4.x client, a 5.0.3+ server over TCP, inline_blob_size NULL and the inline_blobs_unavailable warning"
            exit 1
          }
          ./build/release/test/unittest test/sql/firebird_health.test

      - name: Firebird 3 client against a Firebird 4+ server (writes)
        # The parameter encoder sends INT128 only when the client library
        # is Firebird 4+ too; every other step pairs a client with a server
        # of its own version, so that branch had no leg of its own. One
        # DuckDB version is enough: the encoder has no DuckDB-version
        # branch.
        if: matrix.fb_major != '3' && matrix.duckdb == 'v2.0.1'
        env:
          ISC_USER: SYSDBA
          ISC_PASSWORD: masterkey
        run: |
          # The FB3 libfbclient and its own dependencies, from the FB3
          # image, as the FB4-client step does.
          docker run -d --name fb3client --entrypoint sleep firebirdsql/firebird:3-noble infinity
          trap 'docker rm -f fb3client >/dev/null 2>&1 || true' EXIT
          LIB_IN_CONTAINER=$(docker exec fb3client sh -c "find / -xdev -name 'libfbclient.so*' 2>/dev/null | head -1")
          if [ -z "$LIB_IN_CONTAINER" ]; then
            echo "::error::could not locate libfbclient.so* in firebirdsql/firebird:3-noble"
            exit 1
          fi
          echo "found $LIB_IN_CONTAINER in the FB3 image"
          FB3_DIR="$PWD/fbclient-fb3-on-fb${{ matrix.fb_major }}"
          mkdir -p "$FB3_DIR"
          docker exec fb3client sh -c "ldd '$LIB_IN_CONTAINER'" \
            | grep -oE '/[^ ]+' | sort -u \
            | grep -vE '/(libc|libpthread|libm|libdl|librt|ld-linux)[.-]' \
            | while read -r dep; do
                docker cp -L "fb3client:$dep" "$FB3_DIR/$(basename "$dep")" 2>/dev/null || true
              done
          docker cp -L "fb3client:$LIB_IN_CONTAINER" "$FB3_DIR/$(basename "$LIB_IN_CONTAINER")"
          ls -l "$FB3_DIR"
          export DUCKDB_FIREBIRD_CLIENT_LIBRARY="$FB3_DIR/$(basename "$LIB_IN_CONTAINER")"
          export LD_LIBRARY_PATH="$FB3_DIR"
          # firebird_fb3_client.test checks the pairing (a 3.x client, a 4+
          # server) before anything else. The other files run unchanged
          # through that client. A file that skips (a missing variable)
          # would pass without running, so a skip fails the step.
          # firebird_scan.test stays out: it scans a view whose SUM a
          # Firebird 4+ server returns as INT128, which a Firebird 3
          # client can't describe ("Data type unknown").
          export FIREBIRD_FB3_CLIENT_RW_DB="$FIREBIRD_RW_DB"
          for t in firebird_fb3_client firebird_execute firebird_execute_source firebird_bind_params firebird_ddl_cache firebird_insert firebird_query; do
            out=$(./build/release/test/unittest "test/sql/$t.test" 2>&1) || { echo "$out"; exit 1; }
            echo "$t: $(echo "$out" | tail -n 1)"
            if echo "$out" | grep -q 'All tests were skipped'; then
              echo "::error::$t.test was skipped through the Firebird 3 client"
              exit 1
            fi
          done

      - name: Shared-snapshot consistency under a concurrent writer
        env:
          ISC_USER: SYSDBA
          ISC_PASSWORD: masterkey
        run: |
          # sqllogictest can't interleave a writer with a scan, so this
          # script proves the guarantee directly: a second connection
          # commits transfers between partitions for the whole scan, and
          # every partitioned scan must return the one committed state
          # (FB4+, snapshot_mode = 'shared'). It also checks the opt-in
          # transaction snapshot on the ATTACH path (two scans of one
          # statement, two statements of one transaction, serial scans, the
          # idle limit). On FB3 it checks the fallback ('independent') and
          # only reports the torn reads.
          bash scripts/check_shared_snapshot.sh

      - name: FB4+ live type smoke (INT128 / DECIMAL(38) / TIMESTAMP_TZ)
        if: matrix.fb_major != '3'
        env:
          ISC_USER: SYSDBA
          ISC_PASSWORD: masterkey
          FIREBIRD_BIZ4_DB: firebird://SYSDBA:masterkey@localhost:3050/var/lib/firebird/data/biz4.fdb?charset=UTF8
          # FIREBIRD_DECFLOAT_DB is exported at fixture provisioning
          # (FB4/FB5 legs); firebird_decfloat.test now runs in the main
          # suite step, no longer here.
        run: |
          # DUCKDB / DUCKDB_PRELUDE: set on the DuckDB v2.0 leg only.
          "${DUCKDB:-./build/release/duckdb}" -unsigned <<EOF
          ${DUCKDB_PRELUDE:-}
          SELECT
              typeof(BIG_NUM)  AS t_big_num,
              typeof(BIG_DEC)  AS t_big_dec,
              typeof(TS_TZ)    AS t_ts_tz,
              typeof(T_TZ)     AS t_t_tz
            FROM firebird_scan(
                'firebird://SYSDBA:masterkey@localhost:3050/var/lib/firebird/data/biz4.fdb?charset=UTF8',
                'FB4_TYPES',
                partitions=1)
           LIMIT 1;
          EOF
          ./build/release/test/unittest test/sql/firebird_type_audit_fb4.test

      - name: ATTACH cached PK bounds regression (#93)
        env:
          ISC_USER: SYSDBA
          ISC_PASSWORD: masterkey
        run: |
          # sqllogictest can't insert rows mid-session (the extension never
          # writes), so this script scans ATTACHed tables (caching their PK
          # bounds), inserts rows outside them from isql via `.shell`, and
          # checks that later scans in the same session read them, both
          # partitioned and single-partition. All FB versions.
          bash scripts/check_attach_cached_bounds.sh

      - name: Shared snapshot - worker that cannot join fails the scan
        env:
          ISC_USER: SYSDBA
          ISC_PASSWORD: masterkey
        run: |
          # Kills one, then all, of the pooled attachments of an ATTACH from
          # isql via `.shell` (DELETE FROM MON$ATTACHMENTS), then checks
          # that the next partitioned scan fails with the "could not join
          # the scan's shared snapshot" error, that the dead connections are
          # discarded rather than pooled, what firebird_last_query() shows,
          # and that a later scan succeeds. FB4+; skips itself on FB3.
          bash scripts/check_snapshot_join_failure.sh

      - name: ATTACH - failed catalog load returns its pooled connection
        env:
          ISC_USER: SYSDBA
          ISC_PASSWORD: masterkey
        run: |
          # Parks one pooled connection, kills its attachment from isql via
          # `.shell` (DELETE FROM MON$ATTACHMENTS), then checks that the
          # first table query fails the catalog load, that its connection
          # is discarded rather than left counted as leased
          # (firebird_pool_stats().active_connections back to 0), and that
          # a retry succeeds. All FB versions.
          bash scripts/check_catalog_load_failure.sh

      - name: ATTACH - a dead pooled connection is never handed out again
        env:
          ISC_USER: SYSDBA
          ISC_PASSWORD: masterkey
        run: |
          # Kills a parked pooled connection from isql via `.shell`
          # (DELETE FROM MON$ATTACHMENTS), then checks that firebird_health()
          # and scans work again from the call after the failed one, and that
          # PART_RANGE is partitioned again (#105). All FB versions. On FB4+
          # also a connection killed by the server's idle timeout (idle1).
          # The txsnap phase kills the transaction snapshot's coordinator and
          # the parked connections it could pick, and txreuse (FB4+) has
          # another session reuse a lost snapshot number (#104).
          if [ "${{ matrix.fb_major }}" != "3" ]; then
            export FIREBIRD_IDLE_DB="user=SYSDBA;password=masterkey;database=localhost/3050:idle1;charset=UTF8"
          fi
          bash scripts/check_dead_pooled_connection.sh

      - name: Stop Firebird container
        if: always()
        run: docker rm -f fb || true

      - name: Upload extension artifact (linux_amd64) - fb${{ matrix.fb_major }}
        # One leg only: two uploads under the same name would conflict.
        # build-linux.yml uploads the v2.0.1 build.
        if: matrix.fb_major == '5' && matrix.duckdb == 'v1.5.6'
        uses: actions/upload-artifact@v7
        with:
          name: firebird.duckdb_extension-linux-x64
          path: build/release/extension/firebird/firebird.duckdb_extension
          retention-days: 30
          if-no-files-found: error

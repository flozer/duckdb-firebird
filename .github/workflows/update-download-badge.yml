name: Update download badge

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-download-badge:
    name: Update firebird download badge
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Update badge JSON
        run: node scripts/update_download_badge.mjs

      - name: Open/update badge PR (never pushes to main directly)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # main is a protected branch (required PR, enforce_admins) --
          # a direct push here always fails with GH006. If the badge JSON
          # didn't change, exit clean without creating a branch or PR at
          # all. If it did change, commit ONLY that file to a fixed bot
          # branch (recreated from the current main HEAD every run, so it
          # never carries stale history), force-push it, and open a PR if
          # one isn't already open -- never merge it automatically.
          if git diff --quiet -- .github/badges/downloads.json; then
            echo "Download badge unchanged."
            exit 0
          fi

          BRANCH="bot/update-download-badge"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add .github/badges/downloads.json
          git commit -m "docs: update download badge"
          git push --force origin "$BRANCH"

          existing_pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$existing_pr" = "0" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "docs: update download badge" \
              --body "Automated update to \`.github/badges/downloads.json\` via \`scripts/update_download_badge.mjs\`. No auto-merge -- review and merge manually."
          else
            echo "PR already open for $BRANCH -- branch force-pushed with the latest count, no new PR needed."
          fi
